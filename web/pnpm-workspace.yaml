packages:
  - .
overrides:
  vite@*: 'catalog:'
# Vite+ core uses its release number while providing the Vite 8 API.
peerDependencyRules:
  allowedVersions:
    vite: '*'
  allowAny:
    - vite
saveExact: false
savePrefix: ^
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
