services:
  ovs:
    image: ovs:dev
    build:
      context: ..
      pull: true
    environment:
      OVS_PUBLIC_ORIGIN: ${OVS_PUBLIC_ORIGIN:-http://127.0.0.1:8080}
    ports:
      - "${OVS_BIND_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      - ovs-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  ovs-data:
