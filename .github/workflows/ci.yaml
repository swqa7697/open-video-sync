name: CI

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            modules/sync/go.sum
            scripts/go.sum
      - name: Select validation mode
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make ci-plan
      - uses: actions/setup-node@v6
        if: steps.plan.outputs.mode == 'full'
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        if: steps.plan.outputs.mode == 'full'
        with:
          version: latest
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.plan.outputs.mode == 'full'
      - run: make install
        if: steps.plan.outputs.mode == 'full'
      - run: make check
        if: steps.plan.outputs.mode == 'full'
      - run: make test test-race
        if: steps.plan.outputs.mode == 'full'
      - run: pnpm --dir modules/web exec playwright install --with-deps chromium firefox
        if: steps.plan.outputs.mode == 'full'
      - run: make test-e2e
        if: steps.plan.outputs.mode == 'full'
      - name: Upload browser failure evidence
        if: failure() && steps.plan.outputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: .misc/e2e/results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          archive: true
      - run: make image image-smoke
        if: steps.plan.outputs.mode == 'full'
      - run: make proxy-smoke
        if: steps.plan.outputs.mode == 'full'
      - run: git diff --exit-code
        if: steps.plan.outputs.mode == 'full'
      - name: Record validation result
        if: steps.plan.outputs.mode == 'full'
        run: make ci-finish
      - name: Upload full validation record
        if: steps.plan.outputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: full-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: .misc/ci/full-validation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          archive: true
